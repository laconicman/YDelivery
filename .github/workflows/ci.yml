name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # project.pbxproj is gitignored — XcodeGen regenerates it from project.yml.
      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen

      # -skipPackagePluginValidation: the OpenAPI generator's trust prompt would
      # otherwise hang a non-interactive build (YD-1's own note).
      - name: Build and test
        run: |
          xcodebuild test \
            -scheme YDelivery \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
            -skipMacroValidation \
            -skipPackagePluginValidation

  # Debug's test run alone fills the 30-minute runner — the two builds cannot
  # share one timeout, and the required check must stay `Build and test`.
  release:
    name: Build Release
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen

      # `test` builds Debug only; an archive builds Release, where `#if DEBUG`
      # code is absent. Without this job a preview calling a DEBUG-only
      # fixture passes CI and breaks the archive (it did, #32 → #85).
      - name: Build Release
        run: |
          xcodebuild build \
            -scheme YDelivery \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO
