# The source of truth for YDelivery.xcodeproj — run `xcodegen generate` after editing this
# file or after cloning (TechDebt → YD-4; house precedent NetworkObserverSample/project.yml).
# The generated pbxproj stays out of version control; Package.resolved remains tracked, so
# dependency pins survive regeneration.
name: YDelivery

options:
  # The floor for syncedFolder sources below; older XcodeGen stops with a clear error
  # instead of generating a wrong project.
  minimumXcodeGenVersion: "2.44"
  bundleIdPrefix: com.learnable
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.6"
  # Buildable folders, as the hand-made project had them: file lists never enter the
  # pbxproj, and adding a file needs no regeneration (XcodeGen ≥ 2.44, projectFormat
  # xcode16_0 — its default).
  defaultSourceDirectoryType: syncedFolder

settings:
  base:
    DEVELOPMENT_TEAM: WEJF495R4D
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: 1
    # The floor and the language mode are load-bearing decisions (Design → "The floor is
    # iOS 17, in Swift 6 language mode"); MainActor default isolation is applied on the
    # app target only, matching the project this file replaces.
    SWIFT_VERSION: "6.0"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
    # Compile-time symbols for catalog colors — what DesignSystem's semantic set builds on.
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GCC_C_LANGUAGE_STANDARD: gnu17
    CLANG_CXX_LANGUAGE_STANDARD: gnu++20
  configs:
    Release:
      VALIDATE_PRODUCT: YES

settingGroups:
  # Target-level because XcodeGen's iOS preset would otherwise override the project
  # setting with the legacy "iPhone Developer"; Xcode wrote "Apple Development".
  signing:
    CODE_SIGN_IDENTITY: Apple Development

packages:
  # Consumed by URL at 0.2.x so a clean clone proves the published product builds
  # (workspace CLAUDE.md); cross-editing uses Xcode's local-override instead.
  YandexDeliveryExpress:
    url: https://github.com/laconicman/YandexDeliveryExpress
    # 0.3.1: Client.init takes a transport — YD-14's request-timeout seam.
    minorVersion: 0.3.1
  # Pulled transitively by YandexDeliveryExpress; declared because ClientController
  # imports it directly — `URLSessionTransport(configuration:)` for YD-14's timeout.
  swift-openapi-urlsession:
    url: https://github.com/apple/swift-openapi-urlsession
    from: 1.3.1
  # The API package's logging middleware, declared so the app can compose its own
  # instance into the chain: .debug console visibility beside the shareable file.
  OSLogLoggingMiddleware:
    url: https://github.com/laconicman/OSLogLoggingMiddleware
    minorVersion: 1.1.0
  # The shared foundation below app + future widget/activity (Design → the shared-package
  # decision; DesignSystem holds its component contracts): the semantic color set,
  # StatusChip, the app models, and the order/place stores. Its own repo since 0.1.0,
  # consumed by URL for the same clean-clone reason as the API package above.
  YDeliveryKit:
    url: https://github.com/laconicman/YDeliveryKit
    # 0.3.6 persists the parked NewDelivery draft — YD-16's durable half.
    minorVersion: 0.3.6
  # Compile-checked SF Symbol names (TechDebt → YD-3).
  SFSafeSymbols:
    url: https://github.com/SFSafeSymbols/SFSafeSymbols
    from: 7.0.0
  # Google's libphonenumber metadata, in Swift (author, 2026-09-09): phone entry gets the
  # field users know worldwide instead of a plain TextField. Core parses and validates;
  # the UI package carries PhoneNumberTextField and its SwiftUI representable.
  PhoneNumberKit:
    url: https://github.com/PhoneNumberKit/PhoneNumberKit
    from: 5.0.8
  PhoneNumberKitUI:
    url: https://github.com/PhoneNumberKit/PhoneNumberKitUI
    from: 1.1.0
  # The persistence substrate (Design → the reopened store decision; Schema.md is the
  # contract it implements) lives in YDeliveryKit since 0.2.0 — the app keeps these
  # pins for the *test* target, which drives the queue and SyncEngine directly. Exact
  # pin: the schema was verified against 1.12.0's SyncEngine validation in the spike —
  # an upgrade re-verifies deliberately.
  SQLiteData:
    url: https://github.com/pointfreeco/sqlite-data
    exactVersion: 1.12.0
  # Pulled transitively by sqlite-data; declared because the tests import it directly
  # (Row.fetchOne, db.write, raw SQL against the metadata sidecar).
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 7.11.0
  # The @Table macro now expands inside YDeliveryKit — the conformance descriptors
  # live in its framework, and SyncEngine resolves them against the one shared
  # StructuredQueriesSQLite copy. The test target links the product directly for the
  # same reason it did before: SyncEngine.init reads Table conformances.
  swift-structured-queries:
    url: https://github.com/pointfreeco/swift-structured-queries
    from: 0.39.2
  # sqlite-data's test seam: `.test` context swaps the SyncEngine's CloudKit state for
  # a mock so schema validation runs without iCloud entitlements (spike-verified).
  # Test target only.
  swift-dependencies:
    url: https://github.com/pointfreeco/swift-dependencies
    from: 1.17.0

targets:
  YDelivery:
    type: application
    platform: iOS
    sources:
      - YDelivery
    dependencies:
      - package: YandexDeliveryExpress
        product: YandexDeliveryExpressAPI
      - package: swift-openapi-urlsession
        product: OpenAPIURLSession
      - package: OSLogLoggingMiddleware
        product: OSLogLoggingMiddleware
      - package: YDeliveryKit
        product: YDeliveryKit
      - package: PhoneNumberKit
        product: PhoneNumberKit
      - package: PhoneNumberKitUI
        product: PhoneNumberKitUI
      - package: SFSafeSymbols
        product: SFSafeSymbols
      # The widget extension — embeds into the app's PlugIns; the surfaces
      # inside read the shared App Group store and never the app itself.
      - target: YDeliveryWidgets
      # The share extension (board `5d`) — same rule: App Group files only.
      - target: YDeliveryShare
    settings:
      groups: [signing]
      base:
        # The order store lives in the App Group container from day one — widgets read
        # it directly (Design → "A point carries data, not coordinates"). File at the repo
        # root per the house precedent.
        CODE_SIGN_ENTITLEMENTS: YDelivery.entitlements
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        # The two array keys INFOPLIST_KEY_ cannot express (Xcode ignores unknown
        # INFOPLIST_KEY_ names) live in a partial plist the generation merges in —
        # kept at the repo root, outside the synced sources folder.
        INFOPLIST_FILE: YDelivery-Info.plist
        # When-In-Use only, asked considerately (Roadmap → Phase 2): the picker explains
        # first, and everything works without it.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Your position appears on the map and becomes the pickup point. Everything works without it.
        # CloudKit sync (Schema → Sync tiers): silent pushes wake CKSyncEngine for
        # fetch changes; CKSharingSupported opens the per-order CKShare flow.
        INFOPLIST_KEY_CKSharingSupported: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        STRING_CATALOG_GENERATE_SYMBOLS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
    scheme:
      testTargets:
        - YDeliveryTests
        - YDeliveryUITests

  # The widget extension (board `5b`): two Home Screen widgets, the lock-screen
  # accessories, and the Live Activity's renderer. Its whole world is the Kit —
  # shared store, shared components — because an extension cannot import the app.
  YDeliveryWidgets:
    type: app-extension
    platform: iOS
    sources:
      - YDeliveryWidgets
    dependencies:
      - package: YDeliveryKit
        product: YDeliveryKit
      - package: SFSafeSymbols
        product: SFSafeSymbols
    settings:
      groups: [signing]
      base:
        # The App Group is the extension's only entitlement — the database lives
        # there; sync stays the app's job, so no iCloud keys.
        CODE_SIGN_ENTITLEMENTS: YDeliveryWidgets.entitlements
        # An extension's bundle id must extend its host's — `YDelivery.Widgets`,
        # not the prefix+name XcodeGen would derive.
        PRODUCT_BUNDLE_IDENTIFIER: com.learnable.YDelivery.Widgets
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        GENERATE_INFOPLIST_FILE: YES
        # NSExtension + NSSupportsLiveActivities ride a partial plist — the same
        # merge pattern as the app's INFOPLIST_FILE.
        INFOPLIST_FILE: YDeliveryWidgets-Info.plist
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
        SKIP_INSTALL: YES
        STRING_CATALOG_GENERATE_SYMBOLS: NO
        SWIFT_EMIT_LOC_STRINGS: YES

  # The share extension (board `5d`, "ways in"): an address shared from a chat
  # or a place shared from Maps becomes a draft. The extension resolves text
  # to a point, offers the end-picker and the «Откуда» saved-places row, and
  # hands the app a SharedDraft file — the database stays the app's alone.
  YDeliveryShare:
    type: app-extension
    platform: iOS
    sources:
      - YDeliveryShare
    dependencies:
      - package: YDeliveryKit
        product: YDeliveryKit
      - package: SFSafeSymbols
        product: SFSafeSymbols
    settings:
      groups: [signing]
      base:
        CODE_SIGN_ENTITLEMENTS: YDeliveryShare.entitlements
        # An extension's bundle id must extend its host's.
        PRODUCT_BUNDLE_IDENTIFIER: com.learnable.YDelivery.Share
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: YDeliveryShare-Info.plist
        # The share sheet lists the extension under this name — and installd
        # refuses an appex without one.
        INFOPLIST_KEY_CFBundleDisplayName: YDelivery
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
        SKIP_INSTALL: YES
        STRING_CATALOG_GENERATE_SYMBOLS: NO
        SWIFT_EMIT_LOC_STRINGS: YES

  YDeliveryTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - YDeliveryTests
    dependencies:
      - target: YDelivery
      # The entitlement test speaks the store's own group ID rather than respelling it.
      - package: YDeliveryKit
        product: YDeliveryKit
      # The schema-validation test instantiates SyncEngine under `.test`, and the
      # failure-injection tests drive the queue directly — all test-only seams.
      - package: SQLiteData
        product: SQLiteData
      - package: swift-dependencies
        product: Dependencies
      - package: GRDB
        product: GRDB
      - package: swift-structured-queries
        product: StructuredQueriesSQLite
    settings:
      groups: [signing]
      base:
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/YDelivery.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/YDelivery"
        STRING_CATALOG_GENERATE_SYMBOLS: NO
        SWIFT_EMIT_LOC_STRINGS: NO

  YDeliveryUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - YDeliveryUITests
    dependencies:
      - target: YDelivery
    settings:
      groups: [signing]
      base:
        TEST_TARGET_NAME: YDelivery
        GENERATE_INFOPLIST_FILE: YES
        STRING_CATALOG_GENERATE_SYMBOLS: NO
        SWIFT_EMIT_LOC_STRINGS: NO
